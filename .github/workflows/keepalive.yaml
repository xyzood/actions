name: Keep Alive
run-name: Auto keepalive commit
on:
  schedule:
    - cron: '0 2 1 * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Update keepalive timestamp
        run: |
          echo "$(date -R)" > .keepalive
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "🤖 auto keepalive $(date)"
          git push
